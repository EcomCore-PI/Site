<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Monitoramento</title>
    <link rel="stylesheet" href="dashboard.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <header>
        <h1>Dashboard de Monitoramento</h1>
        <div class="acoes">
            <span id="status">Aguardando dados...</span>
            <span id="hora">--:--:--</span>
            <button id="botao" onclick="alternarAtualizacao()">Pausar</button>
        </div>
    </header>

    <main>
        <section class="kpis">
            <div class="kpi"><p>CPU</p><strong id="kpi-cpu">--%</strong><small id="kpi-cpu-info">--</small></div>
            <div class="kpi"><p>Memória RAM</p><strong id="kpi-ram">--%</strong><small id="kpi-ram-info">--</small></div>
            <div class="kpi"><p>Disco</p><strong id="kpi-disco">--%</strong><small id="kpi-disco-info">--</small></div>
            <div class="kpi"><p>Rede (recebida)</p><strong id="kpi-rede">-- MB/s</strong><small id="kpi-rede-info">--</small></div>
        </section>

        <section class="graficos">
            <div class="grafico grande">
                <h2>CPU e RAM (%)</h2>
                <canvas id="grafico-cpu-ram"></canvas>
            </div>
            <div class="grafico">
                <h2>Disco (GB)</h2>
                <canvas id="grafico-disco"></canvas>
            </div>
            <div class="grafico grande">
                <h2>Rede (MB/s)</h2>
                <canvas id="grafico-rede"></canvas>
            </div>
        </section>
    </main>

    <script src="dashboard.js"></script>
</body>

</html>
