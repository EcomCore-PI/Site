<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoramento do Sistema</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="../assets/EcomCoresemfundo.png" alt="Logo EcomCore">
        </div>
    </header>

    <main>

        <section class="dashboard">
            <div class="card">
                <h2>CPU</h2>

                <p>Uso</p>
                <strong id="cpu">--%</strong>

                <p>Núcleos físicos</p>
                <strong id="cpu-count">--</strong>

                <p>Frequência</p>
                <strong id="cpu-freq">-- MHz</strong>
            </div>

            <div class="card">
                <h2>Memória RAM</h2>

                <p>Uso</p>
                <strong id="memoria-percent">--%</strong>

                <p>Utilizada</p>
                <strong id="memoria-used">-- GB</strong>

                <p>Total</p>
                <strong id="memoria-total">-- GB</strong>
            </div>

            <div class="card">
                <h2>Disco</h2>

                <p>Utilizado</p>
                <strong id="disco-used">-- GB</strong>

                <p>Livre</p>
                <strong id="disco-free">-- GB</strong>

                <p>Total</p>
                <strong id="disco-total">-- GB</strong>
            </div>

            <div class="card">
                <h2>Rede</h2>

                <p>Enviada</p>
                <strong id="bytes-recebidos">-- MB</strong>

                <p>Recebida</p>
                <strong id="bytes-enviados">-- MB</strong>

                <p>Atual</p>
                <strong id="mbps-total">-- MBPS</strong>
            </div>
        </section>

        <section class="acoes">
            <button id="botao-atualizacao" onclick="alternarAtualizacao()">
                Pausar atualização
            </button>
            <p id="status">
                Aguardando dados...
            </p>
            <p id="hora">
                Última Atualização: 00:00:00
            </p>
        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
