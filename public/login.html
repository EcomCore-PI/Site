<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcomCore - Login</title>

    <script src="./js/sessao.js"></script>

    <link rel="icon" href="./assets/imgs/EcomCore.png">
    <link rel="stylesheet" href="./css/login.css">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Fundo cobrindo a tela toda -->
    <div class="background-login">
        
        <!-- Cabeçalho sobreposto ao fundo -->
       <header class="navbar">
            <div class="logo">
                <img src="./assets/imgs/EcomCoresemfundo.png" alt="Logo EcomCore">
            </div>
            
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="#sobre">Sobre nós</a>
                <a href="#servicos">Serviços</a>
                <a href="#passo">Passo a passo</a>
                <a href="#valores">Valores</a>
                <a href="#contato">Contato</a>
            </nav>

            <div class="nav-action">
                <a class="btn-voltar-nav" href="index.html">Voltar</a>
            </div>
        </header>

        <div class="login">
            
            <div class="alerta_erro">
                <div class="card_erro" id="cardErro">
                    <span id="mensagem_erro"></span>
                </div>
            </div>

            <div class="container">
                <div class="card card-login">
                    <h2>Bem-vindo de volta!</h2>
                    <p class="subtitulo">Faça login para acessar o EcomCore.</p>

                    <div class="formulario">
                        <div class="campo">
                            <h4 class="titulo_input">E-mail</h4>
                            <input id="email_input" type="text" placeholder="voce@empresa.com.br">
                        </div>
                        <div class="campo">
                            <h4 class="titulo_input">Senha</h4>
                            <input id="senha_input" type="password" placeholder="******">
                        </div>
                        <button class="botao" onclick="entrar()">Entrar</button>
                    </div>

                    <!-- Telas de carregamento e erro -->
                    <div id="div_aguardar" class="loading-div" style="display: none;">
                        <img src="./assets/circle-loading.gif" id="loading-gif" alt="Carregando">
                    </div>
                    <div id="div_erros_login"></div>

                </div>
            </div>
        </div>
    </div>
</body>
</html>

<script>


    function entrar() {
        aguardar();

        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        // Login Empresa
        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.CARGO_USUARIO = json.cargo;
                    sessionStorage.FK_EMPRESA = json.fk_empresa;

                    if (sessionStorage.CARGO_USUARIO == "Analista") {
                    setTimeout(function () {
                        window.location = "http://localhost:8000/index.html";
                    }, 1000); // apenas para exibir o loading
                    }
                    else if (sessionStorage.CARGO_USUARIO == "Gerente") {
                    setTimeout(function () {
                        window.location = "http://localhost:8000/index.html";
                    }, 1000); // apenas para exibir o loading
                    }
                    else if (sessionStorage.CARGO_USUARIO == "RH") {
                    setTimeout(function () {
                        window.location = "./empresa.html";
                    }, 1000); // apenas para exibir o loadingc
                    }
                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }



    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>
